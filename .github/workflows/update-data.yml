name: Update public data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 日
  push:
    branches: [main]
    paths: ['scripts/fetch-data.mjs', '.github/workflows/update-data.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/region-data.json
          git diff --cached --quiet || (git commit -m "Update public data" && git push)
